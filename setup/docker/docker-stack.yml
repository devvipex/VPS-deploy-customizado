version: '3.8'

services:
  # ==========================================
  # 1. PROXY REVERSO & SSL (Traefik com Let's Encrypt)
  # ==========================================
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencryptresolver.acme.email=${TRAEFIK_ACME_EMAIL:-admin@pablodantascorretor.com}"
      - "--certificatesresolvers.letsencryptresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8082:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certificates:/letsencrypt
    networks:
      - public_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================
  # 2. GESTÃO DE CONTAINERS (Portainer)
  # ==========================================
  portainer:
    image: portainer/portainer-ce:latest
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - public_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN_NAME:-localhost}`)"
        - "traefik.http.routers.portainer.entrypoints=web,websecure"
        - "traefik.http.routers.portainer.tls=true"
        - "traefik.http.routers.portainer.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"
        - "traefik.docker.network=public_net"

  # ==========================================
  # 3. CI/CD & BUILDS LOCAIS (Jenkins)
  # ==========================================
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    user: root
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - public_net
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jenkins.rule=Host(`jenkins.${DOMAIN_NAME:-localhost}`)"
        - "traefik.http.routers.jenkins.entrypoints=web,websecure"
        - "traefik.http.routers.jenkins.tls=true"
        - "traefik.http.routers.jenkins.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
        - "traefik.docker.network=public_net"

  # ==========================================
  # 4. BANCOS DE DADOS & CACHE
  # ==========================================
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_STD_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_STD_PASSWORD}
      POSTGRES_DB: ${POSTGRES_STD_DB:-evoc_db}
    volumes:
      - postgres_std_data:/var/lib/postgresql/data
    networks:
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================
  # 5. MESSAGING & STORAGE
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal_net
      - public_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - public_net
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.minio.rule=Host(`minio.${DOMAIN_NAME:-localhost}`)"
        - "traefik.http.routers.minio.entrypoints=web,websecure"
        - "traefik.http.routers.minio.tls=true"
        - "traefik.http.routers.minio.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.minio.loadbalancer.server.port=9001"
        - "traefik.docker.network=public_net"

  # ==========================================
  # 6. EVOLUTION SUITE (evogo & evoccrm)
  # ==========================================
  evogo:
    image: ${EVOGO_IMAGE:-evoapicloud/evolution-api:latest}
    environment:
      - SERVER_PORT=${EVOGO_PORT:-8080}
      - AUTHENTICATION_API_KEY=${EVOGO_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_STD_USER:-postgres}:${POSTGRES_STD_PASSWORD}@postgres:5432/${POSTGRES_STD_DB:-evoc_db}?schema=public
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - evogo_data:/app/data
    networks:
      - public_net
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.evogo.rule=Host(`evogo.${DOMAIN_NAME:-localhost}`)"
        - "traefik.http.routers.evogo.entrypoints=web,websecure"
        - "traefik.http.routers.evogo.tls=true"
        - "traefik.http.routers.evogo.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.evogo.loadbalancer.server.port=8080"
        - "traefik.docker.network=public_net"

  evoccrm:
    image: ${EVOCCRM_IMAGE:-evoapicloud/evolution-api:latest}
    environment:
      - SERVER_PORT=${EVOCCRM_PORT:-3000}
      - PORT=${EVOCCRM_PORT:-3000}
      - SECRET_KEY=${EVOCCRM_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_STD_USER:-postgres}:${POSTGRES_STD_PASSWORD}@postgres:5432/${POSTGRES_STD_DB:-evoc_db}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - EVOGO_API_URL=http://evogo:8080
    volumes:
      - evoccrm_data:/app/data
    networks:
      - public_net
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.evoccrm.rule=Host(`crm.${DOMAIN_NAME:-localhost}`)"
        - "traefik.http.routers.evoccrm.entrypoints=web,websecure"
        - "traefik.http.routers.evoccrm.tls=true"
        - "traefik.http.routers.evoccrm.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.evoccrm.loadbalancer.server.port=3000"
        - "traefik.docker.network=public_net"

  # ==========================================
  # 7. AUTOMAÇÃO DE WORKFLOWS (n8n)
  # ==========================================
  n8n:
    image: n8nio/n8n:latest
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "http://localhost:5678/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_STD_DB:-evoc_db}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_STD_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_STD_PASSWORD}
      - N8N_HOST=n8n.${DOMAIN_NAME:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${DOMAIN_NAME:-localhost}/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - public_net
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN_NAME:-localhost}`)"
        - "traefik.http.routers.n8n.entrypoints=web,websecure"
        - "traefik.http.routers.n8n.tls=true"
        - "traefik.http.routers.n8n.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.n8n.loadbalancer.server.port=5678"
        - "traefik.docker.network=public_net"

  # ==========================================
  # 8. AUTOMATION & TESTES E2E (Chromium Headless)
  # ==========================================
  chromium-automation:
    image: zenika/alpine-chrome:latest
    command: [
      "--no-sandbox",
      "--disable-gpu",
      "--remote-debugging-address=0.0.0.0",
      "--remote-debugging-port=9222"
    ]
    ports:
      - "9222:9222"
    networks:
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  public_net:
    driver: overlay
    external: true
  internal_net:
    driver: overlay

volumes:
  traefik_certificates:
  portainer_data:
  jenkins_data:
  mongo_data:
  redis_data:
  postgres_data:
  postgres_std_data:
  rabbitmq_data:
  minio_data:
  evogo_data:
  evoccrm_data:
  n8n_data:
