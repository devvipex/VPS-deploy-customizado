services:
  # ==========================================
  # 1. PROXY REVERSO (Traefik DEV - Sem SSL)
  # ==========================================
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8082:8080" # Traefik Dashboard (http://localhost:8082)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dev_net

  # ==========================================
  # 2. GESTÃO DE CONTAINERS (Portainer DEV)
  # ==========================================
  portainer:
    image: portainer/portainer-ce:latest
    command: -H unix:///var/run/docker.sock
    ports:
      - "${PORTAINER_PORT:-9002}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_dev_data:/data
    networks:
      - dev_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.localhost`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  # ==========================================
  # 3. CI/CD & BUILDS (Jenkins DEV)
  # ==========================================
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    user: root
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "50000:50000"
    volumes:
      - jenkins_dev_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dev_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.localhost`)"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"

  # ==========================================
  # 4. BANCOS DE DADOS & CACHE (Portas Expostas para DBeaver / Compass)
  # ==========================================
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - dev_net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - dev_net

  postvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - dev_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_STD_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_STD_PASSWORD}
      POSTGRES_DB: ${POSTGRES_STD_DB:-evoc_db}
    ports:
      - "${POSTGRES_STD_PORT:-5433}:5432"
    volumes:
      - postgres_std_dev_data:/var/lib/postgresql/data
    networks:
      - dev_net

  # ==========================================
  # 5. MESSAGING & STORAGE
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    networks:
      - dev_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_dev_data:/data
    networks:
      - dev_net

  # ==========================================
  # 6. EVOLUTION SUITE (evogo & evoccrm DEV)
  # ==========================================
  evogo:
    image: ${EVOGO_IMAGE:-evoapicloud/evolution-go:latest}
    environment:
      - SERVER_PORT=${EVOGO_PORT:-8080}
      - CLIENT_NAME=${CLIENT_NAME:-evolution}
      - GLOBAL_API_KEY=${EVOGO_API_KEY}
      - AUTHENTICATION_API_KEY=${EVOGO_API_KEY}
      - POSTGRES_AUTH_DB=postgresql://${POSTGRES_STD_USER:-postgres}:${POSTGRES_STD_PASSWORD}@postgres:5432/${POSTGRES_STD_DB:-evoc_db}?sslmode=disable
      - POSTGRES_USERS_DB=postgresql://${POSTGRES_STD_USER:-postgres}:${POSTGRES_STD_PASSWORD}@postgres:5432/${POSTGRES_STD_DB:-evoc_db}?sslmode=disable
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_SAVE_MESSAGES=false
      - WADEBUG=INFO
      - LOGTYPE=console
    ports:
      - "${EVOGO_PORT:-8080}:8080"
    volumes:
      - evogo_dev_data:/app/data
    networks:
      - dev_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evogo.rule=Host(`evogo.localhost`)"
      - "traefik.http.services.evogo.loadbalancer.server.port=8080"

  evoccrm:
    image: ${EVOCCRM_IMAGE:-evoapicloud/evolution-api:latest}
    environment:
      - PORT=${EVOCCRM_PORT:-3000}
      - SECRET_KEY=${EVOCCRM_SECRET_KEY}
      - DATABASE_URL=postgres://${POSTGRES_STD_USER:-postgres}:${POSTGRES_STD_PASSWORD}@postgres:5432/${POSTGRES_STD_DB:-evoc_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - EVOGO_API_URL=http://evogo:8080
    ports:
      - "${EVOCCRM_PORT:-3000}:3000"
    volumes:
      - evoccrm_dev_data:/app/data
    networks:
      - dev_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evoccrm.rule=Host(`crm.localhost`)"
      - "traefik.http.services.evoccrm.loadbalancer.server.port=3000"

  # ==========================================
  # 7. AUTOMAÇÃO DE WORKFLOWS (n8n DEV)
  # ==========================================
  n8n:
    image: n8nio/n8n:latest
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_STD_DB:-evoc_db}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_STD_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_STD_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PORT=5678
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_dev_data:/home/node/.n8n
    networks:
      - dev_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.localhost`)"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # ==========================================
  # 8. AUTOMATION & TESTES E2E (Chromium Headless)
  # ==========================================
  chromium-automation:
    image: zenika/alpine-chrome:latest
    command: [
      "--no-sandbox",
      "--disable-gpu",
      "--remote-debugging-address=0.0.0.0",
      "--remote-debugging-port=9222"
    ]
    ports:
      - "9222:9222"
    networks:
      - dev_net

networks:
  dev_net:
    driver: bridge

volumes:
  portainer_dev_data:
  jenkins_dev_data:
  mongo_dev_data:
  redis_dev_data:
  postgres_dev_data:
  postgres_std_dev_data:
  rabbitmq_dev_data:
  minio_dev_data:
  evogo_dev_data:
  evoccrm_dev_data:
  n8n_dev_data:
